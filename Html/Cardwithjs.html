<!doctype html>
<html>

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="bg-black">


    <div id="result" class="grid sm:grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-5 gap-5 p-5">
        <!-- Show JavaScript data with id  -->
    </div>

    <script>

        function AllCothData() {
            let data = [
                {
                    img: 'https://images.unsplash.com/photo-1521572163474-6864f9cf17ab',
                    title: 'Classic White T-Shirt',
                    des: 'Comfortable cotton casual t-shirt',
                    price: '799'
                },
            ];


            let result = ``

            for (let v of data) {
                result += `
                        <div class="bg-white h-full">
                            <img class="h-150 w-full bg-cover object-cover"
                            src=${v.img} alt="">
                            <h1 class="text-center py-3">${v.title}</h1>
                            <h1 class="text-center py-3">${v.des}</h1>
                            <h1 class="text-center py-3">$ ${v.price}</h1>
                        </div>
            `
            }

            return result
        }
        document.getElementById('result').innerHTML = AllCothData()
    </script>
</body>

</html>
